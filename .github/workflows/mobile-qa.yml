name: mobile-qa
run-name: ${{ inputs.request_id }}

# Real-phone screenshots for KIT: iOS Simulator Safari (macOS runner) and Android emulator Chrome (Linux runner).
# Public repo = standard runners are free and unlimited. Triggered only by bin/mobile-qa.mjs (workflow_dispatch);
# inputs reach scripts through env, never through shell interpolation. Actions are pinned to commit SHAs.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Public URLs, one per line
        required: true
        type: string
      platforms:
        description: ios, android or ios,android
        default: ios,android
        type: string
      request_id:
        description: Caller id (becomes the run name)
        required: true
        type: string
      max_segments:
        description: Screens per page (scroll positions)
        default: '6'
        type: string
      ios_device:
        description: Simulator name, empty = newest plain iPhone
        default: ''
        type: string
      ios_runner:
        description: macOS runner label for the iOS job (fallback when GitHub is short of one pool)
        default: macos-15
        type: choice
        options: [macos-15, macos-15-intel, macos-26]
      test_fault:
        description: Fault injection for the tool's own tests (none, android-setup)
        default: none
        type: choice
        options: [none, android-setup]
      ios_mode:
        description: webdriver (full checks) or openurl (screenshot only; to test the fallback)
        default: webdriver
        type: choice
        options: [webdriver, openurl]

      private_job:
        description: Sealed job of a private (qa-agent) run, base64 ciphertext; empty = public run
        default: ''
        type: string

permissions:
  contents: read

env:
  URLS: ${{ inputs.urls }}
  MAX_SEGMENTS: ${{ inputs.max_segments }}

jobs:
  ios:
    if: contains(inputs.platforms, 'ios')
    runs-on: ${{ inputs.ios_runner || 'macos-15' }}
    timeout-minutes: 45
    env:
      IOS_DEVICE: ${{ inputs.ios_device }}
      JOB_BUDGET_MIN: '36'
      IOS_MODE: ${{ inputs.ios_mode || 'webdriver' }}
      AXE_URL: https://github.com/cameroncooke/AXe/releases/download/v2.0.4/AXe-macOS-v2.0.4-universal.tar.gz
      AXE_SHA256: 3178ec66d9ff46455fec737debad719c41cab16edb1435b2c721e07760a208c3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Install AXe (pinned release, sha256 checked; closes Safari's first-run tip)
        continue-on-error: true
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/axe"
          curl -fsSL "$AXE_URL" -o "$RUNNER_TEMP/axe.tgz"
          echo "$AXE_SHA256  $RUNNER_TEMP/axe.tgz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/axe.tgz" -C "$RUNNER_TEMP/axe"
          BIN=$(find "$RUNNER_TEMP/axe" -type f -name axe -perm -u+x | head -1)
          [ -n "$BIN" ] || { echo "axe binary not found in the archive"; exit 1; }
          dirname "$BIN" >> "$GITHUB_PATH"
          "$BIN" --help > /dev/null 2>&1 || "$BIN" list-simulators > /dev/null
      - name: Safari on iOS Simulator
        if: inputs.private_job == ''
        run: node runner/ios.mjs
      # Private run: the secret is exposed to these two steps only (never job-wide). Nothing readable is uploaded.
      - name: Safari on iOS Simulator (private)
        if: inputs.private_job != ''
        run: node runner/ios.mjs
        env:
          PRIVATE_JOB: ${{ inputs.private_job }}
          PRIVATE_RID: ${{ inputs.request_id }}
          PRIVATE_QA_KEY: ${{ secrets.PRIVATE_QA_KEY }}
      - name: Seal results (private)
        if: always() && inputs.private_job != ''
        run: node runner/private-seal.mjs out/ios ios
        env:
          PRIVATE_RID: ${{ inputs.request_id }}
          PRIVATE_QA_KEY: ${{ secrets.PRIVATE_QA_KEY }}
      - if: always() && inputs.private_job == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios
          path: out/ios
          retention-days: 1
          overwrite: true
          if-no-files-found: warn
      - if: always() && inputs.private_job != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios
          path: sealed/ios
          retention-days: 1
          overwrite: true
          if-no-files-found: warn

  android:
    if: contains(inputs.platforms, 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The AVD snapshot is saved right after it is created (clean), never after browsing real sites.
      # Private runs neither restore nor save the shared AVD cache (it must not carry state between a private run and others).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: avd-cache
        if: inputs.private_job == ''
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-google_apis-x86_64-pixel_7-v2
      - name: Create AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"
      - if: inputs.private_job == '' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-google_apis-x86_64-pixel_7-v2
      - name: Chrome on Android emulator
        id: emu1
        if: inputs.private_job == ''
        continue-on-error: true
        env:
          TEST_FAULT: ${{ inputs.test_fault || 'none' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            if [ "$TEST_FAULT" = "android-setup" ]; then echo "TEST - failing the first emulator step on purpose"; exit 1; fi
            node runner/android.mjs
      # The emulator package download from Google fails now and then ("Error on ZipFile unknown archive"): one retry.
      - name: Chrome on Android emulator (retry after a setup failure)
        if: inputs.private_job == '' && steps.emu1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node runner/android.mjs
      # Private run: same two steps with the secret in their own env; the secret is exposed to these steps only.
      - name: Chrome on Android emulator (private)
        id: emu1p
        if: inputs.private_job != ''
        continue-on-error: true
        env:
          PRIVATE_JOB: ${{ inputs.private_job }}
          PRIVATE_RID: ${{ inputs.request_id }}
          PRIVATE_QA_KEY: ${{ secrets.PRIVATE_QA_KEY }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node runner/android.mjs
      - name: Chrome on Android emulator (private, retry after a setup failure)
        if: inputs.private_job != '' && steps.emu1p.outcome == 'failure'
        env:
          PRIVATE_JOB: ${{ inputs.private_job }}
          PRIVATE_RID: ${{ inputs.request_id }}
          PRIVATE_QA_KEY: ${{ secrets.PRIVATE_QA_KEY }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node runner/android.mjs
      - name: Seal results (private)
        if: always() && inputs.private_job != ''
        run: node runner/private-seal.mjs out/android android
        env:
          PRIVATE_RID: ${{ inputs.request_id }}
          PRIVATE_QA_KEY: ${{ secrets.PRIVATE_QA_KEY }}
      - if: always() && inputs.private_job == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: out/android
          retention-days: 1
          overwrite: true
          if-no-files-found: warn
      - if: always() && inputs.private_job != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: sealed/android
          retention-days: 1
          overwrite: true
          if-no-files-found: warn
