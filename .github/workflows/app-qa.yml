name: app-qa
run-name: ${{ inputs.request_id }}

# Native app QA for KIT. Per platform, one job prepares the release app (a fresh build, or for a JS-only change the
# earlier build with a new Hermes bundle), then one job per flow runs it on its own simulator/emulator in parallel
# (shards). The app source and every artifact are AES-256-GCM encrypted with the repo secret APP_QA_KEY.
# bin/app-qa.mjs uploads the source, dispatches, downloads the results and then deletes the run, the release and the
# key. Inputs reach scripts only through env. Actions are pinned to commit SHAs.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Caller id (becomes the run name)
        required: true
        type: string
      asset_tag:
        description: Release tag that holds app.tgz.enc
        required: true
        type: string
      platforms:
        description: ios, android or ios,android
        default: ios,android
        type: string
      app_id:
        description: iOS bundle id / Android package
        required: true
        type: string
      ios_runner:
        description: macOS runner label
        default: macos-26
        type: choice
        options: [macos-26, macos-15]
      shards:
        description: 'JSON list of {"flow": name without .yaml, "pass": light|dark}, one job each per platform'
        required: true
        type: string
      reuse:
        description: Platforms whose earlier release build is reused (JS-only change; shell-<platform>.tgz.enc)
        default: ''
        type: string
      widgets:
        description: 'Widget plan for shards with pass "widgets" (JSON, bin/app-qa-widgets.mjs); empty = none'
        default: ''
        type: string

permissions:
  contents: read

env:
  ASSET_TAG: ${{ inputs.asset_tag }}
  APP_ID: ${{ inputs.app_id }}
  REUSE: ${{ inputs.reuse }}
  WIDGETS: ${{ inputs.widgets }}
  MAESTRO_VERSION: cli-2.12.1
  MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
  MAESTRO_CLI_NO_ANALYTICS: '1'
  EXPO_NO_TELEMETRY: '1'
  CI: '1'

jobs:
  ios-app:
    if: contains(inputs.platforms, 'ios')
    runs-on: ${{ inputs.ios_runner || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
      - name: Fetch and decrypt the app
        env:
          GH_TOKEN: ${{ github.token }}
          APP_QA_KEY: ${{ secrets.APP_QA_KEY }}
          SHELL_PLATFORM: ios
        run: node runner/app-fetch.mjs
      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund --loglevel=error
      # JS-only change: the earlier release build gets a fresh JS bundle instead of a native rebuild.
      - name: Reuse the earlier build, rebuild only the JS
        if: contains(inputs.reuse, 'ios')
        run: bash runner/app-js-ios.sh
      # Build output goes to files that are sealed with the results: the public log shows only step outcomes.
      - name: Native project (expo prebuild + pods)
        if: ${{ !contains(inputs.reuse, 'ios') }}
        working-directory: app
        run: |
          npx expo prebuild --platform ios --no-install > "$RUNNER_TEMP/prebuild.log" 2>&1 || { echo "prebuild failed"; exit 1; }
          cd ios && pod install > "$RUNNER_TEMP/pods.log" 2>&1 || { echo "pod install failed"; exit 1; }
      - name: Build release for the simulator
        if: ${{ !contains(inputs.reuse, 'ios') }}
        working-directory: app/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          rc=$?; grep -E "BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/xcodebuild.log" | tail -1; exit $rc
      - name: Seal the app for the flow jobs
        env:
          APP_QA_KEY: ${{ secrets.APP_QA_KEY }}
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          [ -n "$APP" ] || { echo "no .app"; exit 1; }
          tar -czf "$RUNNER_TEMP/app.tgz" -C "$(dirname "$APP")" "$(basename "$APP")" -C "$PWD/app" .maestro
          node runner/app-crypt.mjs seal "$RUNNER_TEMP/app.tgz" sealed/app-ios.enc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-ios
          path: sealed/app-ios.enc
          retention-days: 1
          compression-level: 0
      - name: Seal build logs
        if: always()
        env:
          APP_QA_KEY: ${{ secrets.APP_QA_KEY }}
        run: |
          mkdir -p out/build-ios && cp "$RUNNER_TEMP"/*.log out/build-ios/ 2>/dev/null || true
          node runner/app-seal.mjs out/build-ios
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-ios
          path: sealed/build-ios.enc
          retention-days: 1
          if-no-files-found: warn

  ios-flow:
    needs: ios-app
    runs-on: ${{ inputs.ios_runner || 'macos-26' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.shards) }}
    name: ios ${{ matrix.pass }} ${{ matrix.flow }}
    env:
      # The XCTest driver needs more than Maestro's default start time on a busy hosted Mac (seen 2026-11-18).
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
      FLOW: ${{ matrix.flow }}
      PASS: ${{ matrix.pass }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Boot the simulator early
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            const j = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const rts = Object.keys(j).filter((k) => /iOS/.test(k)).sort((a, b) => a.localeCompare(b, "en", { numeric: true }));
            for (const rt of rts.reverse()) { const d = j[rt].find((x) => /^iPhone \d+( Pro)?$/.test(x.name)) || j[rt].find((x) => /^iPhone/.test(x.name)); if (d) { console.log(d.udid); break; } }')
          xcrun simctl boot "$UDID" || true
          # A freshly booted simulator's trust daemon is cold: the app's first HTTPS handshake waited ~11 s in
          # certificate verification and was cancelled (2026-11-23, -1200). One HTTPS page in Safari warms it,
          # in the background while the app downloads.
          nohup bash -c "xcrun simctl bootstatus $UDID -b > /dev/null; xcrun simctl openurl $UDID https://www.apple.com; sleep 8; \
            xcrun simctl terminate $UDID com.apple.mobilesafari; touch $RUNNER_TEMP/warm" > /dev/null 2>&1 &
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-ios
          path: sealed
      - name: Open the prepared app
        env:
          APP_QA_KEY: ${{ secrets.APP_QA_KEY }}
        run: |
          node runner/app-crypt.mjs open sealed/app-ios.enc "$RUNNER_TEMP/app.tgz"
          mkdir -p "$RUNNER_TEMP/ready" && tar -xzf "$RUNNER_TEMP/app.tgz" -C "$RUNNER_TEMP/ready"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/maestro-cache
          key: maestro-${{ env.MAESTRO_VERSION }}-${{ runner.os }}
      - name: Install Maestro (pinned, sha256 checked)
        run: bash runner/app-maestro-install.sh
      - name: Run the flow on the iOS Simulator
        run: bash runner/app-ios.sh
      - name: Seal results
        if: always()
        env:
          APP_QA_KEY: ${{ secrets.APP_QA_KEY }}
        run: node runner/app-seal.mjs "out/ios-$PASS-$FLOW"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: res-ios-${{ matrix.pass }}-${{ matrix.flow }}
          path: sealed/ios-${{ matrix.pass }}-${{ matrix.flow }}.enc
          retention-days: 1
          if-no-files-found: warn

  # A native build happens once here; for a JS-only change (reuse android) this job is skipped and every flow job
  # swaps the JS into the kept build itself, in parallel (round F 2026-11-23: the extra job cost ~1.2 min + handover).
  android-app:
    if: contains(inputs.platforms, 'android') && !contains(inputs.reuse, 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Free disk space (Gradle needs room)
        if: ${{ !contains(inputs.reuse, 'android') }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
      # ~/.npm holds only public registry tarballs (keyed by the OS: the app's lockfile is encrypted until fetched).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ github.run_id }}
          restore-keys: npm-${{ runner.os }}-
      - name: Fetch and decrypt the app
        env:
          GH_TOKEN: ${{ github.token }}
          APP_QA_KEY: ${{ secrets.APP_QA_KEY }}
          SHELL_PLATFORM: android
        run: node runner/app-fetch.mjs
      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund --loglevel=error --prefer-offline
      - name: Reuse the earlier build, rebuild only the JS
        if: contains(inputs.reuse, 'android')
        run: bash runner/app-js-android.sh
      - name: Native project (expo prebuild)
        if: ${{ !contains(inputs.reuse, 'android') }}
        working-directory: app
        run: npx expo prebuild --platform android --no-install > "$RUNNER_TEMP/prebuild.log" 2>&1 || { echo "prebuild failed"; exit 1; }
      - name: Build release APK (x86_64 for the emulator)
        if: ${{ !contains(inputs.reuse, 'android') }}
        working-directory: app/android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain > "$RUNNER_TEMP/gradle.log" 2>&1
          rc=$?; grep -E "BUILD (SUCCESSFUL|FAILED)" "$RUNNER_TEMP/gradle.log" | tail -1; exit $rc
      - name: Seal the app for the flow jobs
        env:
          APP_QA_KEY: ${{ secrets.APP_QA_KEY }}
        run: |
          APK=$(ls app/android/app/build/outputs/apk/release/*.apk | head -1)
          [ -n "$APK" ] || { echo "no APK"; exit 1; }
          tar -czf "$RUNNER_TEMP/app.tgz" -C "$(dirname "$APK")" "$(basename "$APK")" -C "$PWD/app" .maestro
          node runner/app-crypt.mjs seal "$RUNNER_TEMP/app.tgz" sealed/app-android.enc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-android
          path: sealed/app-android.enc
          retention-days: 1
          compression-level: 0
      - name: Seal build logs
        if: always()
        env:
          APP_QA_KEY: ${{ secrets.APP_QA_KEY }}
        run: |
          mkdir -p out/build-android && cp "$RUNNER_TEMP"/*.log out/build-android/ 2>/dev/null || true
          node runner/app-seal.mjs out/build-android
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-android
          path: sealed/build-android.enc
          retention-days: 1
          if-no-files-found: warn

  android-flow:
    needs: android-app
    if: ${{ !cancelled() && contains(inputs.platforms, 'android') && (needs.android-app.result == 'success' || needs.android-app.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.shards) }}
    name: android ${{ matrix.pass }} ${{ matrix.flow }}
    env:
      FLOW: ${{ matrix.flow }}
      PASS: ${{ matrix.pass }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ !contains(inputs.reuse, 'android') }}
        with:
          name: app-android
          path: sealed
      - name: Open the prepared app
        if: ${{ !contains(inputs.reuse, 'android') }}
        env:
          APP_QA_KEY: ${{ secrets.APP_QA_KEY }}
        run: |
          node runner/app-crypt.mjs open sealed/app-android.enc "$RUNNER_TEMP/app.tgz"
          mkdir -p "$RUNNER_TEMP/ready" && tar -xzf "$RUNNER_TEMP/app.tgz" -C "$RUNNER_TEMP/ready"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: contains(inputs.reuse, 'android')
        with:
          node-version: 26
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: contains(inputs.reuse, 'android')
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ github.run_id }}
          restore-keys: npm-${{ runner.os }}-
      - name: Fetch and decrypt the app and the kept build
        if: contains(inputs.reuse, 'android')
        env:
          GH_TOKEN: ${{ github.token }}
          APP_QA_KEY: ${{ secrets.APP_QA_KEY }}
          SHELL_PLATFORM: android
        run: node runner/app-fetch.mjs
      # The app's own packages install and run without the key or the token in their environment.
      - name: Swap the new JS into the kept build
        if: contains(inputs.reuse, 'android')
        run: |
          ( cd app && npm ci --no-audit --no-fund --loglevel=error --prefer-offline )
          bash runner/app-js-android.sh
          APK=$(ls app/android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p "$RUNNER_TEMP/ready" && cp "$APK" "$RUNNER_TEMP/ready/" && cp -r app/.maestro "$RUNNER_TEMP/ready/"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/maestro-cache
          key: maestro-${{ env.MAESTRO_VERSION }}-${{ runner.os }}
      - name: Install Maestro (pinned, sha256 checked)
        run: bash runner/app-maestro-install.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the flow on the Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          # AOSP image (no Google apps): the Pixel Launcher of google_apis froze ("isn't responding") over the app on
          # these CPU-rendered emulators (2026-11-23, 3 of 4 runs); the app needs no Google services.
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash runner/app-android.sh
      - name: Seal results
        if: always()
        env:
          APP_QA_KEY: ${{ secrets.APP_QA_KEY }}
        run: node runner/app-seal.mjs "out/android-$PASS-$FLOW"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: res-android-${{ matrix.pass }}-${{ matrix.flow }}
          path: sealed/android-${{ matrix.pass }}-${{ matrix.flow }}.enc
          retention-days: 1
          if-no-files-found: warn
